<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHECKMRDOC — Giao diện mô phỏng</title><style>
:root{--bg:#070b18;--panel:#101827;--line:#1c3345;--cyan:#29f1ef;--green:#43f19b;--muted:#71869a}*{box-sizing:border-box}body{margin:0;background:#fff;color:#d9f9ff;font:14px Arial,sans-serif}.site{max-width:430px;min-height:100vh;margin:auto;background:radial-gradient(circle at 50% 0%,#15172e,#070b18 55%);box-shadow:0 0 35px #0003;padding:18px 16px 42px}.top{text-align:center}.tiny{font-size:9px;letter-spacing:3px;color:#68859b}.shield{width:75px;height:45px;border:1px solid #2af1e1;border-radius:5px;margin:4px auto 12px;display:grid;place-items:center;color:var(--cyan);font-size:25px;box-shadow:0 0 12px #16e5db40}h2{font-size:17px;color:var(--green);letter-spacing:2px;margin:8px 0}p{color:var(--muted);font-size:10px}.panel{background:#0d1423;border:1px solid #172a3c;border-radius:3px;padding:13px;margin:17px 0}.info{display:flex;justify-content:space-between;font-size:11px;line-height:1.8}.info b{color:#5effab}.banner{position:relative;overflow:hidden;min-height:205px;margin:20px -16px;background:linear-gradient(130deg,#1c2b76,#0d1034 45%,#1249b5);border-block:2px solid #4bcfff;display:flex;align-items:center;justify-content:center;text-align:center}.banner:before{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(from 20deg,#30d5ff24 0 8deg,transparent 8deg 24deg);animation:spin 22s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.banner-content{position:relative;text-shadow:2px 3px 1px #071028,0 0 12px #2fcaff}.banner .eyebrow{font-size:23px;font-weight:900;font-style:italic;color:#fff}.banner .small{display:inline-block;background:white;color:#111b5a;border-radius:16px;padding:5px 14px;font-weight:bold;transform:rotate(-3deg)}.banner .big{font-size:37px;color:#ffe45e;font-weight:1000;font-style:italic;letter-spacing:-1px;-webkit-text-stroke:1px #5a2900}.banner .sub{display:inline-block;background:#10367d;border:1px solid #6ce9ff;color:#ffe981;padding:6px 12px;font-size:11px;font-weight:bold}.heading{text-align:center;font-weight:900;font-size:22px;letter-spacing:5px;color:var(--cyan);text-shadow:0 0 12px #21fff670;margin:19px 0 5px}.rule{height:2px;width:80px;background:#1cdbc8;margin:10px auto 20px}.form-row{display:flex;justify-content:space-between;gap:15px;color:#83a5b5;font-size:10px}.form-row strong{color:#35e6d7}label{display:block;color:#a3c0cd;font-size:11px;margin:10px 0 6px}input{width:100%;padding:12px;background:#08111d;border:1px solid #285b70;color:#e3fcff;outline:none;border-radius:2px}input:focus{border-color:var(--cyan);box-shadow:0 0 8px #29f1ef40}button{cursor:pointer;width:100%;margin-top:13px;padding:12px;background:linear-gradient(90deg,#075a69,#10b9bc);border:1px solid #39f5e8;color:white;font-weight:bold;letter-spacing:2px}button:hover{filter:brightness(1.2)}.foot{text-align:center;color:#4d7181;font-size:10px;margin-top:24px}.overlay{position:fixed;inset:0;background:#02040acc;display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.modal{width:min(370px,100%);background:#0a1020;border:1px solid #f52e78;box-shadow:0 0 25px #f52e7840;padding:22px;text-align:center}.modal h3{color:#ff367e;letter-spacing:2px}.modal p{font-size:13px;line-height:1.6}.modal button{background:#4e1531;border-color:#f52e78}.loading{width:40px;height:40px;border:3px solid #17434e;border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite;margin:12px auto}.notice{color:#ffdc6a;font-size:11px;text-align:center;margin-top:10px}.embedded-site{margin:20px -16px;border:2px solid #39c9ff;background:#091323}.embedded-site img{display:block;width:100%;height:auto}.embed-fallback{text-align:center;padding:9px;font-size:12px}.embed-fallback a{color:#39e9e4}</style></head><body><main class="site"><header class="top"><div class="tiny">SECURITY SYSTEM</div><div class="shield">♢</div><h2>KIỂM TRA TÀI KHOẢN</h2><p>Hệ thống kiểm tra trạng thái tài khoản</p></header><section class="panel"><div class="info"><span>Trạng thái</span><b>● LIVE</b></div><div class="info"><span>Bảo mật</span><b>ON</b></div><div class="info"><span>Cập nhật</span><span id="clock"></span></div></section><section class="embedded-site"><img src="gg88-banner.png" alt="GG88 - Link truy cập tốc độ cao" style="display:block;width:100%;height:auto"></section><div class="heading">CHECKMRDOC</div><div class="rule"></div><section class="panel"><div class="form-row"><span>● KIỂM TRA THÔNG TIN<br><strong>HỆ THỐNG SẴN SÀNG</strong></span><span>TRẠNG THÁI<br><strong>ONLINE</strong></span></div><label for="code">Nhập mã hoặc nội dung cần kiểm tra</label><input id="code" placeholder="Nhập thông tin tại đây" autocomplete="off"><button id="check">KIỂM TRA NGAY</button></section></main><div class="overlay" id="overlay"><div class="modal" id="modal"><h3 id="modalTitle">ĐANG KIỂM TRA</h3><div class="loading" id="spinner"></div><p id="modalText">Đang xử lý thông tin...</p><button id="close">ĐÓNG</button></div></div><script>document.getElementById('clock').textContent=new Date().toLocaleString('vi-VN');const overlay=document.getElementById('overlay'),title=document.getElementById('modalTitle'),message=document.getElementById('modalText'),spinner=document.getElementById('spinner');document.getElementById('check').onclick=()=>{let value=document.getElementById('code').value.trim();overlay.classList.add('show');if(!value){title.textContent='THIẾU THÔNG TIN';message.textContent='Vui lòng nhập thông tin trước khi kiểm tra.';spinner.style.display='none'}else{title.textContent='ĐANG KIỂM TRA';message.textContent='Đang xử lý dữ liệu mô phỏng...';spinner.style.display='block';setTimeout(()=>{if(!overlay.classList.contains('show'))return;title.textContent='HOÀN TẤT DEMO';message.textContent='Đã chạy thử thao tác giao diện. Chưa có máy chủ kiểm tra dữ liệu thực.';spinner.style.display='none'},1300)}};document.getElementById('close').onclick=()=>overlay.classList.remove('show');overlay.onclick=e=>{if(e.target===overlay)overlay.classList.remove('show')}</script></body></html>
